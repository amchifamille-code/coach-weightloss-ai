<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f3d3e">
<title>Coach WeightLoss AI</title>
<link rel="manifest" href="manifest.json">

<style>
/* VOICE everyday : un coach calme, énergique, jamais culpabilisant
   IDEA une montre de sport / appli santé moderne : un anneau de progression, des cartes nettes
   PICTURE l'anneau d'objectif géant sur fond sarcelle profond + la courbe de poids juste dessous
   COLOUR blanc pur, sarcelle profond #0f3d3e, corail énergie #e0482b, menthe #7ee2b8 pour les réussites
   TYPE Outfit (titres, chiffres) + Inter (texte)
   LAYOUT colonne mobile unique, barre d'onglets flottante en bas, cartes arrondies pleine largeur */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0b1314);--card:light-dark(#f2f6f5,#142021);--ink:light-dark(#10201f,#eaf2f0);
--mute:light-dark(#566664,#9cadaa);--line:light-dark(#dfe7e5,#24393a);
--teal:#0f3d3e;--teal2:light-dark(#e3efed,#173436);--tealt:light-dark(#0f3d3e,#9fe0d8);
--acc:#d9432a;--acc2:#ff6a45;--accs:light-dark(#fff0eb,#3a1d16);--acct:light-dark(#b2361e,#ffb4a1);
--mint:#7ee2b8;--warn:light-dark(#8a4b00,#f3b25a);--wbg:light-dark(#fff6e5,#2b2111)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:0 16px 120px}
h1,h2,.num{font-family:Outfit,Inter,sans-serif;letter-spacing:-.02em}
h1{font-size:34px;line-height:1.05;margin:0 0 8px;text-wrap:balance}
h2{font-size:20px;line-height:1.2;margin:0 0 12px}
p{margin:0 0 10px}
.top{display:flex;align-items:center;gap:12px;padding:20px 0 16px}
.top b{font:700 20px/1.2 Outfit,sans-serif}.top small{display:block;color:var(--mute);font-size:14px}
.av{margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--accs);color:var(--acct);display:grid;place-items:center;font:700 17px Outfit,sans-serif;flex:none}
.card{background:var(--card);border-radius:24px;padding:20px;margin-bottom:14px}
.hero{background:var(--teal);color:#fff;border-radius:28px;padding:22px}
.hero .mute{color:#b5d1cd}
.hgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:clamp(130px,38vw,168px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font:800 clamp(30px,9vw,40px)/1 Outfit,sans-serif}
.ring .c span{font-size:13px;color:#b5d1cd}
.ring circle.v{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.big{font:800 clamp(34px,10vw,46px)/1 Outfit,sans-serif;letter-spacing:-.02em}
.unit{font-size:17px;font-weight:600;margin-left:4px}
.trend{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:99px;background:rgba(126,226,184,.16);color:var(--mint);font-size:13px;font-weight:600;white-space:nowrap}
.trend.up{background:rgba(255,106,69,.18);color:#ffb4a1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:20px;padding:16px}
.tile b{display:block;font:700 24px/1.2 Outfit,sans-serif;margin:4px 0 2px}
.tile span{color:var(--mute);font-size:13px}
.mute{color:var(--mute);font-size:14px}
.fig{position:relative;height:210px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font-family:Inter,sans-serif}
button{font:inherit;font-weight:600;border:0;border-radius:16px;min-height:48px;padding:0 18px;cursor:pointer;background:var(--acc);color:#fff;transition:transform .15s}
button:active{transform:scale(.97)}
button.ghost{background:var(--teal2);color:var(--tealt)}
button.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.soft{background:var(--accs);color:var(--acct)}
button.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
button.w{width:100%}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button:disabled{opacity:.5}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500;min-height:44px}
.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.note{background:var(--wbg);color:var(--warn);border-radius:18px;padding:14px 16px;font-size:14px;margin:0 0 14px}
.tip{background:var(--accs);color:var(--acct);border-radius:20px;padding:16px;font-size:15px;margin-bottom:14px}
.err{color:#d9443a;font-size:14px;margin-top:8px;min-height:1em}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border:0}
details{border-top:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--teal2);color:var(--tealt);white-space:nowrap}
.pill.p{background:var(--acc2);color:#fff}
.chk{display:flex;gap:12px;align-items:center;padding:8px 0;font-size:15px;font-weight:500;margin:0}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--acc);flex:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{min-height:54px;padding:0;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);line-height:1.2;border-radius:14px}
.days button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.days button.ok::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--acc2);margin:4px auto 0}
.days small{display:block;font-size:11px;opacity:.7}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:86%;padding:12px 15px;border-radius:20px;white-space:pre-wrap;font-size:15px}
.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:6px}
.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips button{flex:none;min-height:40px;font-size:14px;border-radius:99px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
nav>div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;max-width:520px;background:var(--teal);border-radius:26px;padding:6px;box-shadow:0 10px 30px rgba(15,61,62,.25)}
nav button{background:none;color:#b5d1cd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;min-height:56px;padding:4px 0;border-radius:20px}
nav button.on{background:rgba(255,255,255,.12);color:#fff}
nav button.on svg{color:var(--acc2)}
nav svg{width:23px;height:23px}
.lock{opacity:.45;pointer-events:none;filter:blur(1.5px)}
.glass{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 12px}
.glass i{width:20px;height:26px;border:2px solid var(--tealt);border-radius:4px 4px 8px 8px;opacity:.5}
.glass i.f{background:var(--mint);border-color:var(--mint);opacity:1}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.bd{text-align:center;font-size:12px;font-weight:600;line-height:1.3;color:var(--mute)}
.bd svg{width:52px;height:52px;display:block;margin:0 auto 6px}
.bd.on{color:var(--ink)}
.streak{display:flex;align-items:center;gap:14px}
.streak .num{font-size:44px;font-weight:800;line-height:1;color:var(--acc)}
.fade{animation:f .35s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}.ring circle.v{transition:none}button{transition:none}}
@media(max-width:380px){.hgrid{grid-template-columns:1fr;justify-items:center;text-align:center}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="logo" viewBox="0 0 48 48"><rect width="48" height="48" rx="15" fill="#0f3d3e"/><circle cx="24" cy="24" r="14" fill="none" stroke="#24595a" stroke-width="5"/><path d="M24 10a14 14 0 0 1 13.3 18.3" fill="none" stroke="#ff6a45" stroke-width="5" stroke-linecap="round"/><path d="M17 25l5 5 9-10" fill="none" stroke="#7ee2b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="medal" viewBox="0 0 52 52"><path d="M16 2h8l4 14h-8zM36 2h-8l-4 14h8z" fill="currentColor" opacity=".45"/><circle cx="26" cy="32" r="17" fill="currentColor"/><circle cx="26" cy="32" r="12" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><path d="M26 24l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="#fff"/></symbol>
</svg>
<main id="app"></main>
<nav id="nav" hidden><div>
<button data-t="accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
<button data-t="repas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="7"/><path d="M12 3v3M4 3v6M2 3v4a2 2 0 0 0 4 0V3M20 3v18"/></svg>Repas</button>
<button data-t="sport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Sport</button>
<button data-t="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10h.01M12 10h.01M15 10h.01"/></svg>Coach</button>
<button data-t="profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profil</button>
</div></nav>

<script>
{
const D={p:null,consent:null,w:[],m:[],water:{},wk:{},hab:{},shop:{},swap:{},prem:false,chat:[],ai:{},rem:{eau:true,sport:true,pesee:true},notif:'',lvl:null,ts:0};
const clone=o=>JSON.parse(JSON.stringify(o));
let S=clone(D),tab='accueil',repasDay=null,sportDay=null,ref=null,busy=false,again=false,timer=null,ask=null,editing=false,rest=0,restT=null;
try{const r=localStorage.getItem('cwl-v1');if(r)S=Object.assign(clone(D),JSON.parse(r))}catch(e){}
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=t=>new Date(t).toLocaleDateString('sv');
const today=()=>iso(Date.now());
const dow=()=>(new Date().getDay()+6)%7;
const JOURS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const JL=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const fmt=n=>(Math.round(n*10)/10).toLocaleString('fr-FR');
const fd=(d,o)=>new Date(d+'T12:00').toLocaleDateString('fr-FR',o);

function save(){S.ts=Date.now();try{localStorage.setItem('cwl-v1',JSON.stringify(S))}catch(e){}
  if(ref){clearTimeout(timer);timer=setTimeout(push,900)}}
async function push(){if(!ref)return;if(busy){again=true;return}busy=true;
  try{await ref.set({state:JSON.stringify(S)})}catch(e){}busy=false;if(again){again=false;push()}}

/* ---------- Calculs santé (prudents) ---------- */
const ACT={sed:['Sédentaire',1.2],leg:['Peu actif',1.375],mod:['Actif',1.55],tre:['Très actif',1.725]};
const PREF={cla:'Classique',veg:'Végétarien',hal:'Halal',lac:'Sans lactose'};
function cur(){return S.w.length?S.w[S.w.length-1].v:S.p.w0}
function calc(){const p=S.p,w=cur(),h=p.h/100;
  const bmr=10*w+6.25*p.h-5*p.age+(p.sex==='h'?5:-161);
  const tdee=bmr*ACT[p.act][1],floor=p.sex==='h'?1500:1200;
  const lose=w>p.goal;const kcal=Math.round((lose?Math.max(tdee-400,floor):tdee)/10)*10;
  const total=Math.max(.1,p.w0-p.goal),done=Math.max(0,p.w0-w);
  return{bmi:w/(h*h),kcal,water:Math.max(6,Math.min(14,Math.round(w*0.033/0.25))),pct:w<=p.goal?100:Math.min(99,Math.round(done/total*100)),
    done,left:Math.max(0,w-p.goal),weeks:Math.ceil(Math.max(0,w-p.goal)/0.5),minW:Math.ceil(18.5*h*h)}}
function trend(){if(S.w.length<2)return null;const last=S.w[S.w.length-1],lim=iso(new Date(last.d+'T12:00').getTime()-6*864e5);
  const old=[...S.w].reverse().find(x=>x.d<=lim)||S.w[0];if(old===last)return null;
  return{v:last.v-old.v,days:Math.round((new Date(last.d)-new Date(old.d))/864e5)}}
function lvl(){return S.lvl??({sed:0,leg:0,mod:1,tre:2}[S.p.act])}
function habN(d){return Object.values(S.hab[d]||{}).filter(Boolean).length}
function active(d,c){return S.w.some(x=>x.d===d)||!!S.wk[d]||(S.water[d]||0)>=c.water||habN(d)>=3}
function streak(){const c=calc();let n=0,t=Date.now();if(!active(today(),c))t-=864e5;
  while(active(iso(t),c)&&n<999){n++;t-=864e5}return n}
function habStreak(){let n=0;for(let i=0;i<7;i++)if(habN(iso(Date.now()-i*864e5))>=3)n++;return n}

/* ---------- Données repas ---------- */
const M={
pd:[{n:'Flocons d\'avoine, fruits rouges et amandes',k:350,v:1,l:0,i:['40 g flocons d\'avoine','200 ml lait demi-écrémé','80 g fruits rouges','10 amandes'],r:'Faire chauffer l\'avoine 3 min dans le lait, ajouter fruits et amandes.'},
 {n:'Tartines complètes, œuf et avocat',k:380,v:1,l:1,i:['2 tranches pain complet','1 œuf','1/2 avocat','1 tomate'],r:'Toaster le pain, écraser l\'avocat, ajouter l\'œuf poché ou dur et la tomate.'},
 {n:'Yaourt grec, kiwi et graines',k:300,v:1,l:0,i:['150 g yaourt grec nature','1 kiwi','1 c. à soupe graines de chia','1 c. à café miel'],r:'Mélanger le yaourt et les graines, ajouter le kiwi coupé.'},
 {n:'Smoothie banane, épinards et beurre de cacahuète',k:330,v:1,l:1,i:['1 banane','30 g épinards','250 ml boisson d\'amande','1 c. à soupe beurre de cacahuète'],r:'Tout mixer 1 minute.'},
 {n:'Porridge de chia à la mangue',k:320,v:1,l:1,i:['25 g graines de chia','200 ml boisson de coco','100 g mangue','10 g noix de coco râpée'],r:'Mélanger chia et boisson la veille, garder au frais, ajouter la mangue le matin.'}],
dj:[{n:'Bowl poulet, riz complet et légumes',k:520,v:0,l:1,i:['120 g blanc de poulet','60 g riz complet (cru)','1 courgette','1 poivron','1 c. à soupe huile d\'olive'],r:'Cuire le riz. Poêler poulet et légumes 10 min avec l\'huile et des épices.'},
 {n:'Salade de lentilles, feta et crudités',k:480,v:1,l:0,i:['80 g lentilles (crues)','40 g feta','1 carotte','1/2 concombre','Vinaigrette légère'],r:'Cuire les lentilles 20 min, refroidir, mélanger avec les crudités et la feta.'},
 {n:'Pavé de saumon, patate douce et haricots verts',k:540,v:0,l:1,i:['120 g saumon','150 g patate douce','150 g haricots verts','Citron'],r:'Rôtir la patate douce 25 min à 200 °C, cuire le saumon 12 min, haricots à la vapeur.'},
 {n:'Chili sin carne',k:500,v:1,l:1,i:['120 g haricots rouges cuits','100 g maïs','200 g tomates concassées','1 oignon','60 g riz complet (cru)'],r:'Faire revenir l\'oignon, ajouter tomates, haricots, maïs et épices, mijoter 15 min. Servir avec le riz.'},
 {n:'Wrap complet à la dinde et crudités',k:450,v:0,l:1,i:['1 grande tortilla complète','100 g blanc de dinde','Salade, tomate, carotte râpée','1 c. à soupe houmous'],r:'Tartiner le houmous, garnir, rouler.'},
 {n:'Buddha bowl tofu, quinoa et avocat',k:510,v:1,l:1,i:['100 g tofu ferme','50 g quinoa (cru)','1/2 avocat','100 g chou rouge','Sauce soja'],r:'Cuire le quinoa 12 min, dorer le tofu 8 min, assembler avec les légumes.'}],
dd:[{n:'Soupe de légumes et omelette aux herbes',k:420,v:1,l:1,i:['2 œufs','300 g légumes pour soupe','Herbes fraîches','1 tranche pain complet'],r:'Cuire et mixer les légumes. Omelette 3 min à la poêle.'},
 {n:'Poêlée de crevettes, brocoli et quinoa',k:450,v:0,l:1,i:['120 g crevettes','150 g brocoli','50 g quinoa (cru)','Ail, gingembre'],r:'Cuire le quinoa 12 min. Sauter crevettes et brocoli 6 min avec ail et gingembre.'},
 {n:'Curry de pois chiches et épinards',k:480,v:1,l:1,i:['150 g pois chiches cuits','100 g épinards','100 ml lait de coco léger','1 oignon','Curry en poudre'],r:'Faire revenir l\'oignon et le curry, ajouter le reste, mijoter 10 min.'},
 {n:'Filet de cabillaud, purée de chou-fleur',k:400,v:0,l:0,i:['150 g cabillaud','300 g chou-fleur','1 c. à soupe crème légère','Persil'],r:'Cuire le chou-fleur 15 min, mixer avec la crème. Cabillaud 10 min au four.'},
 {n:'Tortilla espagnole légère et salade verte',k:430,v:1,l:1,i:['3 œufs','150 g pomme de terre','1 oignon','Salade verte'],r:'Cuire pomme de terre et oignon en dés, ajouter les œufs battus, cuire à feu doux 10 min.'}],
co:[{n:'Pomme et amandes',k:170,v:1,l:1,i:['1 pomme','15 g amandes']},
 {n:'Fromage blanc et cannelle',k:120,v:1,l:0,i:['150 g fromage blanc 0 %','Cannelle']},
 {n:'Bâtonnets de carotte et houmous',k:150,v:1,l:1,i:['2 carottes','30 g houmous']},
 {n:'Banane et carré de chocolat noir',k:140,v:1,l:1,i:['1 petite banane','10 g chocolat noir']}]};
const SLOTS=[['Petit-déjeuner','pd',0],['Déjeuner','dj',1],['Collation','co',0],['Dîner','dd',2]];
function pick(arr,i){const p=S.p.pref;let a=arr.filter(m=>(p!=='veg'||m.v)&&(p!=='lac'||m.l));if(!a.length)a=arr;return a[((i%a.length)+a.length)%a.length]}
function dayMeals(d){const c=calc();const raw=SLOTS.map(([t,k,o],s)=>[t,pick(M[k],d+o+(S.swap[d+'-'+s]||0)),s]);
  const base=raw.reduce((a,m)=>a+m[1].k,0),f=Math.min(1.6,Math.max(.85,Math.round(c.kcal/base*20)/20));
  const sc=x=>f===1?x:x.replace(/(\d+)\s?(g|ml)\b/g,(_,n,u)=>Math.max(5,Math.round(n*f/5)*5)+' '+u);
  return{f,meals:raw.map(([t,m,s])=>[t,{...m,k:Math.round(m.k*f/10)*10,i:m.i.map(sc)},s])}}

/* ---------- Données sport ---------- */
const EX={
A:[['Squats','3 × {10|15|20}','Pieds largeur d\'épaules, dos droit, descends comme pour t\'asseoir.'],['Pompes','3 × {6 sur les genoux|10|15}','Mains sous les épaules, corps aligné.'],['Fentes alternées','3 × {8|12|16} par jambe','Grand pas en avant, genou arrière vers le sol.'],['Gainage planche','3 × {20|35|50} s','Coudes sous les épaules, ventre serré, ne creuse pas le dos.'],['Pont fessier','3 × {12|15|20}','Allongé, pousse le bassin vers le haut, serre les fessiers.']],
B:[['Montées de genoux','4 × {20|30|40} s','Sur place, à ton rythme, respire régulièrement.'],['Chaise contre un mur','3 × {20|35|50} s','Dos collé au mur, cuisses parallèles au sol.'],['Superman','3 × {8|12|15}','Allongé sur le ventre, lève bras et jambes 2 s.'],['Mountain climbers','3 × {15|25|35} s','En position de pompe, ramène les genoux vers la poitrine.'],['Crunchs','3 × {10|15|20}','Décolle seulement les épaules, ne tire pas sur la nuque.']],
M:[['Marche rapide','{20|30|40} min','Rythme où tu peux parler mais pas chanter.']],
R:[['Étirements doux','{10|15|20} min','Jambes, dos, épaules, 30 s par position, sans douleur.']],
Z:[['Repos complet','—','Le repos fait partie du programme : le corps récupère.']]};

const LV=['Débutant','Intermédiaire','Avancé'];
const rep=s=>s.replace(/\{([^}]+)\}/,(_,a)=>a.split('|')[lvl()]);

const MOTIV=['Chaque petit pas compte. Aujourd\'hui, vise juste un peu mieux qu\'hier.','La régularité bat la perfection : un écart n\'annule pas tes efforts.','Bois un grand verre d\'eau maintenant, ton corps te dira merci.','Une marche de 10 minutes après le repas, c\'est déjà un vrai progrès.','Sois fier·e d\'avoir pris soin de toi aujourd\'hui.','Ton objectif est un chemin, pas une course.','Dors bien ce soir : le sommeil aide aussi à mieux gérer l\'appétit.'];

/* ---------- Badges ---------- */
const BADGES=[['Première pesée',c=>S.w.length>=1],['1er kilo perdu',c=>c.done>=1],['5 kg perdus',c=>c.done>=5],['Mi-parcours',c=>c.pct>=50],['Objectif atteint',c=>c.pct>=100],
 ['Première séance',c=>Object.keys(S.wk).length>=1],['10 séances',c=>Object.keys(S.wk).length>=10],['7 jours bien hydraté',c=>Object.values(S.water).filter(v=>v>=c.water).length>=7],
 ['Série de 7 jours',c=>streak()>=7],['Habitudes en or',c=>habStreak()>=5],['Tour de taille suivi',c=>S.m.length>=2],['Question au coach',c=>Object.keys(S.ai).length>0]];

/* ---------- Rendu ---------- */
function render(){
  const app=$('#app');
  if(!S.p||editing){$('#nav').hidden=!S.p;app.innerHTML=onboarding();bindForm();return}
  if(!S.consent){$('#nav').hidden=true;app.innerHTML=consentScreen();return}
  $('#nav').hidden=false;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  app.innerHTML='<div class="fade">'+({accueil,repas,sport,coach,profil}[tab])()+'</div>';
  if(tab==='accueil'){drawChart();requestAnimationFrame(()=>{const r=$('#rv');if(r)r.style.strokeDashoffset=r.dataset.o})}
  if(tab==='coach'){const c=$('#chatEnd');if(c)c.scrollIntoView({block:'end'})}
}
function head(t,s){return`<div class="top"><svg width="44" height="44"><use href="#logo"/></svg><div><b>${t}</b><small>${s}</small></div>${S.p?`<div class="av" aria-hidden="true">${esc(S.p.name[0].toUpperCase())}</div>`:''}</div>`}
const CONSENT='J\'accepte que mes données de santé (poids, taille, mensurations, habitudes) soient enregistrées pour mon suivi personnel. Elles ne sont ni vendues ni partagées, et je peux les effacer à tout moment.';
function consentScreen(){return head('Une dernière étape','Protection de tes données')+`<section class="card"><h2>Ton accord pour tes données de santé</h2>
  <p class="mute">La loi (RGPD) demande ton accord explicite, car le poids et les mensurations sont des données de santé.</p>
  <label class="chk" style="align-items:flex-start"><input type="checkbox" id="cs2">${CONSENT}</label>
  <div class="err" id="ce"></div><button class="w" id="okc">Continuer</button></section>`}

function onboarding(){const p=S.p||{};
  const seg=(k,o,v)=>`<div class="seg" data-k="${k}">${Object.entries(o).map(([a,b])=>`<button type="button" data-v="${a}" class="${v===a?'on':''}">${esc(Array.isArray(b)?b[0]:b)}</button>`).join('')}</div>`;
  return`<div class="fade">${S.p?head('Modifier mon profil','Tes réponses ajustent tes conseils'):`
  <div style="padding:40px 0 18px"><svg width="72" height="72"><use href="#logo"/></svg>
  <h1 style="margin-top:18px">Ton coach minceur, dans ta poche</h1><p class="mute" style="font-size:16px">Un programme repas, sport et motivation adapté à toi, à un rythme sain.</p></div>`}
  <form class="card" id="f" novalidate>
  <h2>${S.p?'Mon profil':'Créons ton profil'}</h2>
  <label for="nm">Prénom</label><input id="nm" autocomplete="given-name" value="${esc(p.name)}" maxlength="30">
  <label>Sexe (pour le calcul des besoins)</label>${seg('sex',{f:'Femme',h:'Homme'},p.sex)}
  <div class="grid"><div><label for="age">Âge</label><input id="age" type="number" inputmode="numeric" value="${esc(p.age)}" placeholder="30"></div>
  <div><label for="ht">Taille (cm)</label><input id="ht" type="number" inputmode="numeric" value="${esc(p.h)}" placeholder="170"></div>
  <div><label for="w0">Poids actuel (kg)</label><input id="w0" type="number" step="0.1" inputmode="decimal" value="${esc(S.p?cur():'')}" placeholder="80"></div>
  <div><label for="gl">Objectif (kg)</label><input id="gl" type="number" step="0.1" inputmode="decimal" value="${esc(p.goal)}" placeholder="72"></div></div>
  <label>Activité physique</label>${seg('act',ACT,p.act)}
  <label>Préférences alimentaires</label>${seg('pref',PREF,p.pref||'cla')}
  ${S.consent?'':`<label class="chk" style="align-items:flex-start;margin-top:16px"><input type="checkbox" id="cs">${CONSENT}</label>`}
  <div class="err" id="er"></div>
  <button class="w" style="margin-top:6px">${S.p?'Enregistrer':'Commencer mon programme'}</button>
  ${S.p?'<button type="button" class="line w" id="cancel" style="margin-top:8px">Annuler</button>':''}
  <p class="mute" style="margin-top:14px">Cette application donne des conseils généraux et ne remplace pas un médecin ou un diététicien. Réservée aux 18 ans et plus. Si tu es enceinte, allaites ou as une maladie, parles-en d'abord à un professionnel de santé.</p>
  <p class="mute">Une application ASI.HÉLIOS · contact.heliosasi@gmail.com</p>
  </form></div>`}
function bindForm(){const sel={sex:S.p?.sex,act:S.p?.act,pref:S.p?.pref||'cla'};
  document.querySelectorAll('.seg').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    sel[g.dataset.k]=b.dataset.v;g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}));
  $('#cancel')?.addEventListener('click',()=>{editing=false;render()});
  $('#f').addEventListener('submit',e=>{e.preventDefault();const er=$('#er');
    const name=$('#nm').value.trim(),age=+$('#age').value,h=+$('#ht').value,w=+$('#w0').value,goal=+$('#gl').value;
    if(!name)return er.textContent='Indique ton prénom.';
    if(!sel.sex)return er.textContent='Choisis ton sexe.';
    if(!(age>=18&&age<=100))return er.textContent=age&&age<18?'Cette application est réservée aux adultes (18 ans et plus).':'Indique un âge valide.';
    if(!(h>=120&&h<=230))return er.textContent='Indique ta taille en centimètres (ex. 170).';
    if(!(w>=35&&w<=300))return er.textContent='Indique un poids valide en kg.';
    if(!(goal>=35&&goal<=300))return er.textContent='Indique ton objectif de poids en kg.';
    const first=!S.p,start=first?w:S.p.w0;
    if(goal>=start)return er.textContent=`Ton objectif doit être inférieur à ton poids de départ (${fmt(start)} kg).`;
    const minW=Math.ceil(18.5*(h/100)**2);
    if(goal<minW)return er.textContent=`Pour rester en bonne santé, ton objectif ne devrait pas être sous ${minW} kg (IMC 18,5). Choisis un objectif plus doux.`;
    if(!sel.act)return er.textContent='Choisis ton niveau d\'activité.';
    if(!S.consent){if(!$('#cs').checked)return er.textContent='Coche la case d\'accord pour continuer.';S.consent=today()}
    S.p={name,sex:sel.sex,age,h,goal,act:sel.act,pref:sel.pref,w0:start,start:first?today():S.p.start};
    if(first||w!==cur())logW(w,true);
    editing=false;save();tab='accueil';render();window.scrollTo(0,0)})}

function logW(v,silent){const d=today();S.w=S.w.filter(x=>x.d!==d);S.w.push({d,v});S.w.sort((a,b)=>a.d<b.d?-1:1);if(!silent){save();render()}}

function accueil(){const c=calc(),p=S.p,d=today(),wt=S.water[d]||0,done=S.wk[d],ses=PROG[dow()],t=trend(),st=streak(),R=52,L=2*Math.PI*R;
  const rem=pending(c);
  return head('Bonjour '+esc(p.name),new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))+`
  <section class="hero" style="margin-bottom:14px"><div class="hgrid">
   <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${R}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="12"/>
    <circle id="rv" class="v" cx="60" cy="60" r="${R}" fill="none" stroke="url(#gr)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L}" data-o="${L*(1-c.pct/100)}"/>
    <defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#ff6a45"/><stop offset="1" stop-color="#ffb36b"/></linearGradient></defs></svg>
    <div class="c" role="img" aria-label="${c.pct} % de l'objectif"><b>${c.pct} %</b><span>de l'objectif</span></div></div>
   <div><span class="mute">Poids actuel</span><div class="big">${fmt(cur())}<span class="unit">kg</span></div>
    ${t?`<span class="trend ${t.v>0?'up':''}">${t.v>0?'+':t.v<0?'−':''}${fmt(Math.abs(t.v))} kg en ${t.days} j</span>`:''}
    <p class="mute" style="margin:10px 0 0">Objectif ${fmt(p.goal)} kg <span class="pill p" style="vertical-align:1px">${S.prem?'Premium':'Gratuit'}</span></p></div></div>
   <p class="mute" style="margin:14px 0 0">${c.left>0?`${fmt(c.done)} kg perdus, encore ${fmt(c.left)} kg. À un rythme sain (≈ 0,5 kg/semaine), compte environ ${c.weeks} semaines. C'est une estimation, pas une garantie.`:'Objectif atteint, bravo ! Pense maintenant à stabiliser ton poids en gardant tes bonnes habitudes.'}</p>
  </section>
  ${rem.length?`<section class="note" role="status"><b>À faire aujourd'hui</b><br>${rem.map(esc).join('<br>')}</section>`:''}
  <section class="card"><div class="row sp"><h2>Ma courbe</h2><span class="mute">${S.w.length} pesée${S.w.length>1?'s':''}</span></div>
   <div class="fig"><svg id="ch" role="img" aria-label="Évolution du poids"></svg></div>
   <form id="wf" class="row" style="margin-top:12px"><input id="wv" type="number" step="0.1" inputmode="decimal" placeholder="Poids du jour (kg)" style="flex:1" aria-label="Poids du jour"><button>Ajouter</button></form>
   <div class="err" id="we"></div></section>
  <div class="grid" style="margin-bottom:14px">
   <div class="tile"><span>Calories conseillées</span><b>${c.kcal.toLocaleString('fr-FR')}</b><span>kcal / jour</span></div>
   <div class="tile"><span>IMC</span><b>${fmt(c.bmi)}</b><span>${c.bmi<18.5?'Insuffisance':c.bmi<25?'Normal':c.bmi<30?'Surpoids':'Obésité'}</span></div>
   <div class="tile"><span>Séance du jour</span><b style="font-size:18px">${esc(ses[0])}</b><span>${ses[1]==='Z'?'Récupération':done?'Faite':'À faire'}</span></div>
   <div class="tile"><span>Série en cours</span><b>${st} jour${st>1?'s':''}</b><span>d'actions d'affilée</span></div></div>
  <section class="card"><div class="row sp"><h2>Hydratation</h2><span class="mute">${wt}/${c.water} verres</span></div>
   <div class="glass">${Array.from({length:c.water},(_,i)=>`<i class="${i<wt?'f':''}"></i>`).join('')}</div>
   <div class="row"><button class="ghost sm" data-wa="-1" aria-label="Retirer un verre">− 1</button><button class="sm" data-wa="1" style="flex:1">+ 1 verre (25 cl)</button></div></section>
  <section class="tip"><b>Le mot du coach</b><br>${esc(MOTIV[new Date().getDate()%MOTIV.length])}</section>
  <section class="card"><div class="row sp"><h2>Tour de taille</h2>${S.m.length>1?`<span class="pill">${S.m[S.m.length-1].v-S.m[0].v>0?'+':''}${fmt(S.m[S.m.length-1].v-S.m[0].v)} cm depuis le début</span>`:''}</div>
   <p class="mute">Le tour de taille montre aussi tes progrès quand la balance stagne. Mesure au niveau du nombril, une fois par semaine.</p>
   <form id="mf" class="row"><input id="mv" type="number" step="0.5" inputmode="decimal" placeholder="Tour de taille (cm)" style="flex:1" aria-label="Tour de taille en cm"><button class="ghost">Ajouter</button></form>
   <div class="err" id="me"></div>
   ${S.m.length?`<ul class="list">${S.m.slice(-3).reverse().map(x=>`<li><span>${fd(x.d)}</span><b>${fmt(x.v)} cm</b></li>`).join('')}</ul>`:''}</section>
  <section class="card"><h2>Historique des pesées</h2><ul class="list">${S.w.slice(-8).reverse().map(x=>`<li><span>${fd(x.d)}</span><span class="row"><b>${fmt(x.v)} kg</b><button class="line sm" data-del="${esc(x.d)}" aria-label="Supprimer la pesée du ${fd(x.d)}">✕</button></span></li>`).join('')||'<li class="mute">Aucune pesée.</li>'}</ul></section>`}

function pending(c){const d=today(),wt=S.water[d]||0,ses=PROG[dow()],r=[];
  if(S.rem.eau&&wt<c.water)r.push(`Hydratation : ${wt}/${c.water} verres pour l'instant.`);
  if(S.rem.sport&&!S.wk[d]&&ses[1]!=='Z')r.push(`Séance du jour : ${ses[0]}.`);
  if(S.rem.pesee&&dow()===0&&!S.w.some(x=>x.d===d))r.push('C\'est lundi : pèse-toi le matin, à jeun.');return r}

function drawChart(){const s=$('#ch');if(!s)return;const draw=()=>{const W=s.clientWidth,H=s.clientHeight;if(!W)return;
  const pts=S.w.slice(-30),g=S.p.goal,vals=pts.map(x=>x.v).concat(g),lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1),pl=34,pr=12,pt=14,pb=24;
  const X=i=>pl+(pts.length<2?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1)),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let o=`<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a45" stop-opacity=".28"/><stop offset="1" stop-color="#ff6a45" stop-opacity="0"/></linearGradient></defs>`;
  [hi,lo].forEach(v=>o+=`<text x="0" y="${Y(v)+4}" font-size="12" fill="currentColor" opacity=".55">${v}</text>`);
  o+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--tealt)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W-pr}" y="${Y(g)-7}" text-anchor="end" font-size="12" font-weight="600" fill="var(--tealt)" style="paint-order:stroke;stroke:var(--card);stroke-width:4px">Objectif ${fmt(g)}</text>`;
  if(pts.length>1){const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
    o+=`<path d="${d}L${X(pts.length-1)},${H-pb}L${X(0)},${H-pb}Z" fill="url(#ar)"/><path d="${d}" fill="none" stroke="var(--acc2)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`}
  pts.forEach((p,i)=>{const last=i===pts.length-1;o+=`<circle cx="${X(i)}" cy="${Y(p.v)}" r="${last?6:3.5}" fill="${last?'var(--acc2)':'var(--card)'}" stroke="var(--acc2)" stroke-width="2"/>`});
  if(pts.length){o+=`<text x="${pl}" y="${H-4}" font-size="12" fill="currentColor" opacity=".55">${fd(pts[0].d,{day:'numeric',month:'short'})}</text>`;
    if(pts.length>1)o+=`<text x="${W-pr}" y="${H-4}" text-anchor="end" font-size="12" fill="currentColor" opacity=".55">${fd(pts[pts.length-1].d,{day:'numeric',month:'short'})}</text>`}
  s.innerHTML=o};draw();if(window._ro)window._ro.disconnect();window._ro=new ResizeObserver(draw);window._ro.observe(s)}

function repas(){const c=calc(),d=repasDay??dow(),{f,meals}=dayMeals(d),k=meals.reduce((a,m)=>a+m[1].k,0),key='j'+d,lock=!S.prem&&d!==dow();
  const items=[...new Set(meals.flatMap(m=>m[1].i))],shop=(S.shop[key]||[]).filter(x=>items.includes(x)),hab=S.hab[today()]||{};
  const HAB=[['leg','Des légumes à 2 repas'],['eau','L\'eau plutôt que les boissons sucrées'],['lent','Manger lentement, sans écran'],['gri','Pas de grignotage entre les repas']];
  return head('Nutrition',`${c.kcal.toLocaleString('fr-FR')} kcal/jour conseillées · ${PREF[S.p.pref]}`)+`
  <section class="card"><div class="days">${JOURS.map((j,i)=>`<button data-rd="${i}" class="${i===d?'on':''}" aria-label="${JL[i]}${!S.prem&&i!==dow()?' (Premium)':''}">${j}<small>${!S.prem&&i!==dow()?'<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>':i===dow()?'Auj.':''}</small></button>`).join('')}</div></section>
  ${lock?`<section class="note"><b>Le menu de ${JL[d]} est inclus dans Premium.</b><br>Ton menu du jour reste gratuit.<div class="row" style="margin-top:10px"><button class="sm" data-go="profil">Découvrir Premium</button><button class="line sm" data-rd="${dow()}">Revenir à aujourd'hui</button></div></section>`:''}
  <section class="card ${lock?'lock':''}"><div class="row sp"><h2>Menu de ${JL[d]}</h2><span class="pill">≈ ${k.toLocaleString('fr-FR')} kcal</span></div>
  ${f!==1?`<p class="mute">Portions ajustées à tes besoins (×${String(f).replace('.',',')}).</p>`:''}
  ${meals.map(([t,m,s])=>`<details><summary><span><span class="mute">${t}</span><br>${esc(m.n)}</span><span class="pill">${m.k} kcal</span></summary>
   <p style="margin-top:10px"><b>Ingrédients (1 pers.)</b></p><ul>${m.i.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${m.r?`<p><b>Préparation</b> : ${esc(m.r)}</p>`:''}
   <button class="soft sm" data-sw="${s}">Changer ce plat</button></details>`).join('')}
  ${k<c.kcal-150?`<p class="mute" style="margin-top:10px">Il te reste environ ${c.kcal-k} kcal : ajoute un fruit, un laitage ou des féculents si tu as faim. Ne descends pas sous tes besoins conseillés.</p>`:''}
  ${S.p.pref==='hal'?'<p class="mute">Viandes à choisir certifiées halal. Aucun porc ni alcool dans les recettes.</p>':''}</section>
  ${lock?'':`<section class="card"><div class="row sp"><h2>Liste de courses</h2><span class="mute">${shop.length}/${items.length}</span></div>
  ${items.map((x,i)=>`<label class="chk"><input type="checkbox" data-sh="${i}" ${shop.includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</section>`}
  <section class="card"><div class="row sp"><h2>Mes habitudes du jour</h2><span class="pill">${habN(today())}/4</span></div>
  ${HAB.map(([id,t])=>`<label class="chk"><input type="checkbox" data-hb="${id}" ${hab[id]?'checked':''}>${t}</label>`).join('')}
  <p class="mute" style="margin-top:6px">${habStreak()} jour${habStreak()>1?'s':''} sur les 7 derniers avec au moins 3 bonnes habitudes.</p></section>
  <p class="mute">Les calories sont des estimations. Pour un suivi médical ou un régime spécifique, consulte un diététicien.</p>`}

function sport(){const d=sportDay??dow(),ses=PROG[d],L=lvl(),lock=!S.prem&&d!==dow();
  const wk=JOURS.map((j,i)=>({j,i,ok:!!S.wk[iso(Date.now()+(i-dow())*864e5)]})),doneN=wk.filter(x=>x.ok).length;
  return head('Sport',`Niveau ${LV[L]} · à la maison, sans matériel`)+`
  <section class="card"><h2>Mon niveau</h2><div class="seg">${LV.map((n,i)=>`<button data-l="${i}" class="${i===L?'on':''}">${n}</button>`).join('')}</div></section>
  <section class="card"><div class="row sp"><h2>Ma semaine</h2><span class="pill">${doneN} séance${doneN>1?'s':''}</span></div>
  <div class="days">${wk.map(x=>`<button data-sd="${x.i}" class="${x.i===d?'on':''} ${x.ok?'ok':''}" aria-label="${JL[x.i]}${x.ok?', séance faite':''}">${x.j}</button>`).join('')}</div></section>
  ${lock?`<section class="note"><b>Le détail des autres jours est inclus dans Premium.</b><br>Ta séance du jour reste gratuite.<div class="row" style="margin-top:10px"><button class="sm" data-go="profil">Découvrir Premium</button><button class="line sm" data-sd="${dow()}">Revenir à aujourd'hui</button></div></section>`:''}
  <section class="card ${lock?'lock':''}"><div class="row sp"><h2>${esc(ses[0])}</h2><span class="pill">${JL[d]}</span></div>
  ${EX[ses[1]].map(([n,r,t])=>`<details><summary><span>${esc(n)}</span><span class="pill">${esc(rep(r))}</span></summary><p class="mute" style="margin-top:6px">${esc(t)}</p></details>`).join('')}
  ${'AB'.includes(ses[1])?`<p class="mute" style="margin-top:8px">Échauffe-toi 5 min avant. Repos 45 à 60 s entre les séries.</p><button class="ghost w" id="rest">${rest?`Repos : ${rest} s (toucher pour arrêter)`:'Lancer le minuteur de repos (60 s)'}</button>`:''}
  ${d===dow()&&ses[1]!=='Z'?`<button class="w ${S.wk[today()]?'ghost':''}" style="margin-top:10px" id="done">${S.wk[today()]?'Séance faite · annuler':'J\'ai fait ma séance'}</button>`:''}</section>
  <p class="mute">Arrête-toi en cas de douleur, d'essoufflement inhabituel ou de malaise. Avec un problème de santé (cœur, articulations, tension), demande d'abord l'avis de ton médecin.</p>`}

function coach(){const n=S.ai[today()]||0,lim=S.prem?50:5;
  const q=['Que manger ce soir avec peu de temps ?','Comment éviter le grignotage ?','Je n\'ai pas perdu cette semaine, normal ?','Un exercice rapide pour aujourd\'hui ?'];
  return head('Coach IA','Disponible 24 h/24 · conseils généraux')+`
  <div class="chat">${S.chat.length?'':`<div class="msg ai">Bonjour ${esc(S.p.name)} ! Je suis ton coach. Pose-moi tes questions sur l'alimentation, le sport ou la motivation. Je donne des conseils généraux et ne remplace pas un professionnel de santé.</div>`}
  ${S.chat.map(m=>`<div class="msg ${m.r==='u'?'me':'ai'}">${esc(m.t)}</div>`).join('')}<div id="chatEnd"></div></div>
  <div class="chips">${q.map(x=>`<button class="ghost" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>
  <form id="cf" class="row" style="margin-top:8px;align-items:flex-end"><textarea id="cq" rows="2" maxlength="600" placeholder="Écris ta question…" style="flex:1" aria-label="Ta question"></textarea><button id="cs" ${ask?'disabled':''}>Envoyer</button></form>
  <p class="mute" style="margin-top:8px">${n}/${lim} messages aujourd'hui${S.prem?'':' · 50 par jour avec Premium'}</p>
  ${S.chat.length?'<button class="line sm" id="clr">Effacer la conversation</button>':''}`}

async function sendQ(text){text=text.trim();if(!text||ask)return;const d=today(),lim=S.prem?50:5;
  if((S.ai[d]||0)>=lim){S.chat.push({r:'u',t:text},{r:'a',t:'Tu as atteint la limite de messages pour aujourd\'hui. Reviens demain, ou passe à Premium pour un coaching avancé.'});save();render();return}
  S.chat.push({r:'u',t:text},{r:'a',t:'…'});render();
  const out=S.chat[S.chat.length-1],c=calc(),p=S.p;
  let sample=null;try{sample=window.claude?await window.claude.use('sample'):null}catch(e){}
  if(!sample){out.t='Le coach IA n\'est pas encore disponible dans cette version. Il arrivera avec les comptes utilisateurs (étape suivante).';save();render();return}
  const hist=S.chat.slice(-12,-2).map(m=>(m.r==='u'?'Utilisateur: ':'Coach: ')+m.t).join('\n');
  const prompt=`Tu es "Coach WeightLoss AI", un coach minceur bienveillant qui parle français, tutoie l'utilisateur et répond en 120 mots maximum, simplement, sans markdown.
Règles de sécurité obligatoires : ne promets jamais de perte de poids garantie ; ne propose jamais de régime extrême, de jeûne prolongé, de produit amincissant ou moins de ${p.sex==='h'?1500:1200} kcal/jour ; vise au plus 0,5 à 1 kg par semaine ; tu ne remplaces pas un médecin ou un diététicien et tu les recommandes en cas de maladie, médicament, grossesse, douleur ou symptôme ; si l'utilisateur évoque des comportements alimentaires inquiétants (se faire vomir, ne plus manger, culpabilité intense), réponds avec douceur et encourage-le à en parler à un médecin ou à un proche.
Profil : ${p.name}, ${p.age} ans, ${p.sex==='h'?'homme':'femme'}, ${p.h} cm, poids actuel ${fmt(cur())} kg, objectif ${fmt(p.goal)} kg, activité ${ACT[p.act][0]}, alimentation ${PREF[p.pref]}, environ ${c.kcal} kcal/jour conseillées, niveau sport ${LV[lvl()]}.
${hist?'Conversation récente :\n'+hist+'\n':''}Nouvelle question de l'utilisateur : ${text}`;
  ask=new AbortController();
  try{const r=await sample(prompt,{cache:false,signal:ask.signal,modelTier:'quick',onText:({text:t})=>{out.t=t;const el=document.querySelectorAll('.msg.ai');if(el.length)el[el.length-1].textContent=t}});
    out.t=(r&&r.text)||out.t;S.ai[d]=(S.ai[d]||0)+1}
  catch(e){out.t=e&&e.code==='rate_limited'?'Trop de questions en peu de temps, réessaie dans une minute.':e&&e.code==='not_granted'?'Le coach IA n\'a pas été autorisé. Recharge la page et accepte la demande pour l\'utiliser.':'Désolé, je n\'ai pas pu répondre. Réessaie dans un instant.'}
  ask=null;S.chat=S.chat.slice(-30);save();render()}

function profil(){const p=S.p,c=calc(),got=BADGES.filter(b=>b[1](c)).length,st=streak();
  const canN='Notification' in window&&'serviceWorker' in navigator&&window.isSecureContext;
  return head('Mon profil',esc(p.name))+`
  <section class="card"><div class="streak"><div class="num">${st}</div><div><b>jour${st>1?'s':''} de série</b><br><span class="mute">Pèse-toi, bois ton eau, fais ta séance ou 3 bonnes habitudes pour la garder.</span></div></div></section>
  <section class="card"><div class="row sp"><h2>Mes badges</h2><span class="pill">${got}/${BADGES.length}</span></div>
   <div class="badges">${BADGES.map(([n,f])=>{const on=f(c);return`<div class="bd ${on?'on':''}"><svg style="color:${on?'var(--acc2)':'var(--line)'}" aria-hidden="true"><use href="#medal"/></svg>${n}${on?'':'<br><span class="mute" style="font-size:12px">à gagner</span>'}</div>`}).join('')}</div></section>
  <section class="card"><ul class="list">
   <li><span>Âge</span><b>${p.age} ans</b></li><li><span>Taille</span><b>${p.h} cm</b></li>
   <li><span>Poids de départ</span><b>${fmt(p.w0)} kg</b></li><li><span>Objectif</span><b>${fmt(p.goal)} kg</b></li>
   <li><span>Activité</span><b>${ACT[p.act][0]}</b></li><li><span>Alimentation</span><b>${PREF[p.pref]}</b></li>
   <li><span>Hydratation conseillée</span><b>${c.water} verres</b></li></ul>
   <button class="ghost w" style="margin-top:10px" id="edit">Modifier mon profil</button></section>
  <section class="card"><h2>Rappels</h2>
   ${[['eau','Rappels d\'hydratation'],['sport','Rappels d\'entraînement'],['pesee','Rappel de pesée du lundi']].map(([k,t])=>`<label class="chk"><input type="checkbox" data-rm="${k}" ${S.rem[k]?'checked':''}>${t}</label>`).join('')}
   ${canN?`<button class="ghost w" id="notif" style="margin-top:8px">${typeof Notification!=='undefined'&&Notification.permission==='granted'?'Notifications du téléphone activées':'Activer les notifications du téléphone'}</button><p class="mute" style="margin-top:8px">Un rappel s'affiche quand tu ouvres l'appli et qu'il te reste des choses à faire.</p>`:'<p class="mute">Les rappels s\'affichent dans l\'appli. Les notifications du téléphone fonctionnent avec la version installée sur Android.</p>'}</section>
  <section class="card"><div class="row sp"><h2>Premium</h2><span class="pill p">${S.prem?'Actif (démo)':'Gratuit'}</span></div>
   <ul class="list"><li><span>Suivi du poids, courbe, badges</span><b>Gratuit</b></li><li><span>Menu et séance du jour</span><b>Gratuit</b></li><li><span>Coach IA</span><b>5 / jour</b></li>
   <li><span>Menus et sport sur 7 jours</span><b>Premium</b></li><li><span>Coach IA avancé (50 / jour)</span><b>Premium</b></li></ul>
   <button class="w" style="margin-top:10px" id="prem">${S.prem?'Revenir à la version gratuite':'Activer Premium (mode démo)'}</button>
   <p class="mute" style="margin-top:8px">Mode démo : aucun paiement. Le vrai abonnement Stripe sera branché à une étape suivante.</p></section>
  <section class="card"><h2>Mes données</h2><p class="mute" id="sync">Données enregistrées sur cet appareil.</p>
   ${S.consent?`<p class="mute">Accord pour les données de santé donné le ${fd(S.consent)}.</p>`:''}
   <button class="line w" id="exp">Copier mes données</button><div id="xo"></div>
   <button class="line w" id="reset" style="margin-top:8px">Effacer toutes mes données</button><div id="rc"></div></section>
  <section class="card"><h2>À propos</h2><ul class="list">
   <li><span>Éditeur</span><b>ASI.HÉLIOS</b></li>
   <li><span>Contact</span><b style="overflow-wrap:anywhere;text-align:right">contact.heliosasi@gmail.com</b></li></ul>
   <p class="mute" style="margin-top:8px">Une question, un souci ou une suggestion ? Écris-nous à cette adresse.</p></section>
  <p class="mute">Coach WeightLoss AI, une application ASI.HÉLIOS, donne des conseils généraux. Elle ne remplace pas un médecin ou un diététicien et ne garantit aucun résultat.</p>`}

/* ---------- Notifications (version installée) ---------- */
async function notify(force){try{if(!S.p||!S.consent||typeof Notification==='undefined'||Notification.permission!=='granted'||!navigator.serviceWorker)return;
  const d=today();if(!force&&S.notif===d)return;const r=pending(calc());if(!r.length&&!force)return;
  const reg=await navigator.serviceWorker.ready;await reg.showNotification('Coach WeightLoss AI',{body:r.length?r.join('\n'):'Les notifications sont activées.',icon:'icon-192.png',badge:'badge-96.png',tag:'rappel'});
  S.notif=d;save()}catch(e){}}

/* ---------- Événements ---------- */
document.addEventListener('click',async e=>{const b=e.target.closest('button,input[type=checkbox]');if(!b)return;const ds=b.dataset;
  if(b.closest('nav')||ds.go){tab=ds.t||ds.go;repasDay=null;sportDay=null;render();window.scrollTo(0,0);return}
  if(ds.wa){const d=today();S.water[d]=Math.max(0,Math.min(30,(S.water[d]||0)+ +ds.wa));save();render()}
  else if(ds.del){S.w=S.w.filter(x=>x.d!==ds.del);if(!S.w.length)S.w=[{d:today(),v:S.p.w0}];save();render()}
  else if(ds.rd){repasDay=+ds.rd;render()}
  else if(ds.sd){sportDay=+ds.sd;render()}
  else if(ds.l){S.lvl=+ds.l;save();render()}
  else if(ds.sw){const d=repasDay??dow(),k=d+'-'+ds.sw;S.swap[k]=(S.swap[k]||0)+1;save();render();
    const el=document.querySelectorAll('details')[+ds.sw];if(el)el.open=true}
  else if(ds.sh!==undefined){const d=repasDay??dow(),items=[...new Set(dayMeals(d).meals.flatMap(m=>m[1].i))],x=items[+ds.sh],k='j'+d,a=S.shop[k]||[];
    S.shop[k]=b.checked?[...a,x]:a.filter(y=>y!==x);save()}
  else if(ds.hb){const d=today();S.hab[d]=Object.assign({},S.hab[d],{[ds.hb]:b.checked});save();render()}
  else if(ds.rm){S.rem[ds.rm]=b.checked;save()}
  else if(ds.q)sendQ(ds.q);
  else if(b.id==='done'){const d=today();if(S.wk[d])delete S.wk[d];else S.wk[d]=1;save();render()}
  else if(b.id==='rest'){clearInterval(restT);if(rest){rest=0;render();return}rest=60;render();
    restT=setInterval(()=>{rest--;const el=$('#rest');if(rest<=0){clearInterval(restT);rest=0;try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
      if(el)el.textContent=rest?`Repos : ${rest} s (toucher pour arrêter)`:'Repos terminé, série suivante !'},1000)}
  else if(b.id==='okc'){if(!$('#cs2').checked){$('#ce').textContent='Coche la case pour continuer.';return}S.consent=today();save();render()}
  else if(b.id==='edit'){editing=true;render();window.scrollTo(0,0)}
  else if(b.id==='prem'){S.prem=!S.prem;save();render()}
  else if(b.id==='notif'){try{const r=await Notification.requestPermission();if(r==='granted')await notify(true);render()}catch(e){}}
  else if(b.id==='exp'){const txt=JSON.stringify(S,null,1);try{await navigator.clipboard.writeText(txt);$('#xo').innerHTML='<p class="tip" style="margin:8px 0 0">Données copiées. Tu peux les coller dans un e-mail ou une note.</p>'}
    catch(err){$('#xo').innerHTML='<textarea rows="5" style="margin-top:8px" readonly aria-label="Mes données">'+esc(txt)+'</textarea>'}}
  else if(b.id==='clr'){S.chat=[];save();render()}
  else if(b.id==='reset'){$('#rc').innerHTML='<p class="note" style="margin-top:10px">Tout ton suivi sera supprimé. Confirmer ?</p><div class="row"><button id="rok">Oui, tout effacer</button><button class="line" id="rno">Annuler</button></div>'}
  else if(b.id==='rno')$('#rc').innerHTML='';
  else if(b.id==='rok'){S=clone(D);save();tab='accueil';render()}
});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='wf'){const v=+$('#wv').value;if(!(v>=35&&v<=300)){$('#we').textContent='Indique un poids valide en kg.';return}logW(v)}
  if(e.target.id==='mf'){const v=+$('#mv').value;if(!(v>=40&&v<=200)){$('#me').textContent='Indique un tour de taille valide en cm.';return}
    const d=today();S.m=S.m.filter(x=>x.d!==d);S.m.push({d,v});S.m.sort((a,b)=>a.d<b.d?-1:1);save();render()}
  if(e.target.id==='cf')sendQ($('#cq').value)});
document.addEventListener('keydown',e=>{if(e.target.id==='cq'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendQ(e.target.value)}});

render();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.claude)navigator.serviceWorker.register('sw.js').then(()=>notify()).catch(()=>{})}catch(e){}

/* ---------- Sauvegarde dans le compte (si disponible) ---------- */
(async()=>{try{if(!window.claude)return;const [db,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!u)return;const id=await u.id();if(!id)return;const r=db.doc('data/users/'+id+'/app');
  const s=await r.get();ref=r;
  if(s.exists){const v=s.data();if(v&&v.state){const o=JSON.parse(v.state);if((o.ts||0)>(S.ts||0)){S=Object.assign(clone(D),o);try{localStorage.setItem('cwl-v1',JSON.stringify(S))}catch(e){}if(!editing)render()}}}
  else if(S.p)push();
  window._synced=true;const y=$('#sync');if(y)y.textContent='Données sauvegardées dans ton compte et sur cet appareil.'}catch(e){}})();
new MutationObserver(()=>{const y=$('#sync');if(y&&window._synced&&!y.dataset.s){y.dataset.s=1;y.textContent='Données sauvegardées dans ton compte et sur cet appareil.'}}).observe($('#app'),{childList:true});
}
</script>
</body>
</html>
